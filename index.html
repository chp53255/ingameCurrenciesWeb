<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14122B">
<meta name="robots" content="noindex">
<title>Gem Store</title>
<style>
  :root {
    --bg: #14122B; --panel: #221F45; --line: #3A3670;
    --gold: #F2B632; --cream: #F6F3EA; --muted: #B9B5D6;
    --common: #9A98B0; --rare: #4EA8DE; --epic: #C77DFF; --legendary: #F2B632;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--cream); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }

  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .brand { font-weight: 800; letter-spacing: 3px; color: var(--gold); }
  .wallet { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 700; }
  .wallet span { color: var(--muted); font-weight: 600; margin-right: 6px; font-size: 14px; }

  .promo { background: linear-gradient(90deg, #3a1d5c, #5b2a6e); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
  .promo .flash { font-weight: 800; color: var(--gold); animation: pulse 1.2s ease-in-out infinite; }
  .promo .timer { font-size: 14px; color: var(--muted); }
  .promo .timer b { color: var(--cream); font-variant-numeric: tabular-nums; }

  h1 { font-size: 26px; margin: 0 0 14px; line-height: 1.2; }
  h2 { font-size: 20px; margin: 24px 0 10px; }
  .sub { color: var(--muted); margin: -6px 0 18px; }

  .modes { display: flex; flex-direction: column; gap: 16px; }
  .mode { position: relative; display: flex; flex-direction: column; gap: 6px; width: 100%; background: var(--panel); color: var(--cream);
    border: 1px solid var(--line); border-radius: 18px; padding: 24px 18px 18px; text-align: left; }
  .mode.featured { border: 2px solid var(--gold); background: linear-gradient(145deg, #3b2a12, #221F45 60%); box-shadow: 0 0 28px rgba(242,182,50,.3); }
  .mode .badge { position: absolute; top: -11px; left: 14px; background: var(--muted); color: var(--bg); font-size: 12px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px; padding: 3px 10px; border-radius: 999px; }
  .mode.featured .badge { background: var(--gold); }
  .mode .name { font-size: 28px; font-weight: 800; }
  .mode .pitch { font-size: 17px; font-weight: 700; color: var(--gold); }
  .mode:not(.featured) .pitch { color: var(--muted); }
  .mode .price { margin-top: 6px; font-size: 16px; color: var(--muted); }
  .mode .price b { color: var(--cream); font-size: 20px; }

  .stage { display: flex; justify-content: center; margin: 14px 0; min-height: 260px; align-items: center; }
  .box { width: 210px; height: 250px; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(145deg, #3a3670, #221f45); border: 2px solid var(--line); text-align: center; padding: 12px; }
  .box.premium { background: linear-gradient(145deg, #6b4e10, #2c2341); border-color: var(--gold); }
  .box .q { font-size: 72px; font-weight: 800; color: var(--muted); }
  .box.premium .q { color: var(--gold); }
  .box.shake { animation: shake .55s ease-in-out infinite; }
  .box.result { animation: pop .35s ease-out; }
  .box .tier { font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
  .box .item { font-size: 18px; font-weight: 800; margin-top: 4px; line-height: 1.15; }
  .box .portrait { width: 140px; height: 150px; object-fit: contain; border-radius: 10px; margin-bottom: 8px; }
  .box .note { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .box.t-Common { border-color: var(--common); background: linear-gradient(145deg, #3a3670, #221f45); } .box.t-Common .tier { color: var(--common); }
  .box.t-Rare { border-color: var(--rare); background: linear-gradient(145deg, #1d3a55, #221f45); } .box.t-Rare .tier { color: var(--rare); }
  .box.t-Epic { border-color: var(--epic); background: linear-gradient(145deg, #45225f, #221f45); } .box.t-Epic .tier { color: var(--epic); }
  .box.t-Legendary { border-color: var(--legendary); background: linear-gradient(145deg, #6b4e10, #2c2341); box-shadow: 0 0 40px rgba(242,182,50,.6); }
  .box.t-Legendary .tier { color: var(--legendary); }

  .count { text-align: center; color: var(--muted); font-size: 15px; margin: 0 0 12px; }
  .count b { color: var(--cream); }
  .cta { width: 100%; background: var(--gold); color: var(--bg); border: 0; border-radius: 14px; padding: 18px 12px; font-weight: 800; font-size: 19px; }
  .ghost { flex: 1; background: transparent; color: var(--cream); border: 1px solid var(--line); border-radius: 14px; padding: 16px 12px; font-weight: 700; font-size: 16px; }
  .actions { display: flex; gap: 10px; }
  .actions .cta { flex: 1; width: auto; }

  .hook { margin-top: 16px; background: #3a1d2b; border: 1px solid #7a3550; border-radius: 14px; padding: 14px; }
  .hook p { margin: 0 0 10px; font-weight: 700; }
  .topup { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--panel); border-radius: 10px; padding: 12px; opacity: .6; }
  .topup .lock { font-size: 13px; color: var(--muted); text-align: right; }

  .tally { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 700; background: var(--panel); border: 1px solid var(--line); }
  .chip.Common { color: var(--common); } .chip.Rare { color: var(--rare); } .chip.Epic { color: var(--epic); } .chip.Legendary { color: var(--legendary); }
  .pulls { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 6px; }
  .pulls li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel); border-radius: 10px; padding: 8px 12px; font-size: 15px; }
  .pulls .who { display: flex; align-items: center; gap: 10px; }
  .pulls img { width: 36px; height: 40px; object-fit: cover; border-radius: 6px; }
  .pulls .Common { color: var(--common); } .pulls .Rare { color: var(--rare); } .pulls .Epic { color: var(--epic); } .pulls .Legendary { color: var(--legendary); font-weight: 800; }

  .reveal { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 18px; }
  .reveal p { color: var(--muted); margin: 0 0 10px; font-size: 15px; }
  .reveal form { display: flex; gap: 8px; }
  .reveal input { flex: 1; min-width: 0; font-size: 18px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
    color: var(--cream); text-transform: uppercase; letter-spacing: 2px; }
  .reveal button { flex: 0 0 auto; width: auto; padding: 12px 18px; }
  .reveal .err { color: #ff8fa3; font-size: 14px; margin-top: 8px; min-height: 18px; }
  .reveal form.wrong { animation: shake .35s ease-in-out 1; }

  .fineprint { margin-top: 26px; text-align: center; }
  .fineprint button { background: none; border: 0; color: #5d5a7e; font-size: 11px; text-decoration: underline; padding: 6px; }

  .modal { position: fixed; inset: 0; background: rgba(8,7,20,.75); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: var(--panel); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom));
    width: 100%; max-width: 480px; }
  .sheet p { margin: 0 0 12px; font-size: 18px; }
  .sheet .fine { color: var(--muted); font-size: 14px; }
  .sheet .tiny { color: #6f6c92; font-size: 11px; line-height: 1.5; }

  /* Receipt */
  .receipt { background: var(--cream); color: var(--bg); border-radius: 18px; padding: 20px 18px; }
  .receipt h1 { color: var(--bg); margin-bottom: 4px; }
  .receipt .spent { font-size: 48px; font-weight: 800; margin: 4px 0 2px; }
  .receipt .spentnote { color: #5b5874; margin: 0 0 12px; }
  .receipt table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .receipt td { padding: 9px 0; border-top: 1px dashed #cfc8b1; vertical-align: top; }
  .receipt td:last-child { text-align: right; font-weight: 800; padding-left: 10px; }
  .receipt .warn td:last-child { color: #a1262e; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; }
  .card h2 { margin: 0 0 10px; }
  .headline { font-size: 20px; font-weight: 800; color: var(--gold); margin: 0 0 12px; line-height: 1.3; }
  .cmp { width: 100%; border-collapse: collapse; font-size: 15px; }
  .cmp th { text-align: right; font-size: 13px; color: var(--muted); padding: 6px 0 6px 8px; font-weight: 700; }
  .cmp th:first-child { text-align: left; padding-left: 0; }
  .cmp td { padding: 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
  .cmp td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; padding-left: 8px; font-weight: 700; }
  .cmp .mine { color: var(--gold); }
  .cmp td .why { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .muted { color: var(--muted); }
  .tricks { margin: 0; padding-left: 20px; } .tricks li { margin-bottom: 8px; }
  .footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 20px; }

  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg) scale(1.03); } 75% { transform: rotate(6deg) scale(1.03); } }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<noscript><p style="padding:16px">This store needs JavaScript turned on.</p></noscript>

<script>
"use strict";

/* ===== Settings you may want to change ===== */
const CONFIG = {
  revealCode: "RECEIPT",       // presenters say this out loud at the reveal
  startGems: 2000,             // every player starts with this many gems...
  packUSD: 19.99,              // ...which is what this "Starter Pack" costs (hidden until the receipt)
  timerSeconds: 120,           // fake "offer ends" countdown; silently restarts
  topUp: { gems: 500, usd: 4.99 },   // the locked offer shown when gems run out
  // Each mode: price per box in gems, and tiers rolled on 1..1000
  // (a tier wins if the roll is <= its max, checked in this order; pct is for display).
  modes: [
    {
      id: "high", name: "High Roller", badge: "Premium", pitch: "2× Legendary odds!", featured: true, boxPrice: 850,
      tiers: [
        { name: "Legendary", max: 10,   pct: 1 },
        { name: "Epic",      max: 100,  pct: 9 },
        { name: "Rare",      max: 350,  pct: 25 },
        { name: "Common",    max: 1000, pct: 65 }
      ]
    },
    {
      id: "std", name: "Standard", badge: "Classic", pitch: "Standard odds, more boxes", boxPrice: 340,
      tiers: [
        { name: "Legendary", max: 5,    pct: 0.5 },
        { name: "Epic",      max: 50,   pct: 4.5 },
        { name: "Rare",      max: 210,  pct: 16 },
        { name: "Common",    max: 1000, pct: 79 }
      ]
    }
  ],
  // Rarity follows how recently each person served: the most recent are rarest.
  // img paths are relative to index.html; put the 15 files in an img/ folder.
  items: {
    Legendary: [
      { name: "Donald Trump",      note: "45th & 47th President", img: "img/trump.jpg" },
      { name: "Joe Biden",         note: "46th President",        img: "img/biden.jpg" }
    ],
    Epic: [
      { name: "Barack Obama",      note: "44th President",        img: "img/obama.jpg" },
      { name: "George W. Bush",    note: "43rd President",        img: "img/bush.jpg" },
      { name: "Bill Clinton",      note: "42nd President",        img: "img/clinton.jpg" }
    ],
    Rare: [
      { name: "Ronald Reagan",     note: "40th President",        img: "img/reagan.jpg" },
      { name: "Jimmy Carter",      note: "39th President",        img: "img/carter.jpg" },
      { name: "John F. Kennedy",   note: "35th President",        img: "img/jfk.jpg" },
      { name: "Theodore Roosevelt", note: "26th President",       img: "img/teddy-roosevelt.jpg" }
    ],
    Common: [
      { name: "Ulysses S. Grant",  note: "18th President",        img: "img/grant.jpg" },
      { name: "Abraham Lincoln",   note: "16th President",        img: "img/lincoln.jpg" },
      { name: "Andrew Jackson",    note: "7th President",         img: "img/jackson.jpg" },
      { name: "Thomas Jefferson",  note: "3rd President",         img: "img/jefferson.jpg" },
      { name: "George Washington", note: "1st President",         img: "img/washington.jpg" },
      { name: "Benjamin Franklin", note: "Founding Father (never President)", img: "img/franklin.jpg" }
    ]
  },
  storageKey: "gemstore-v3"
};
const TIER_ORDER = ["Legendary", "Epic", "Rare", "Common"];

/* ===== State (saved so a refresh doesn't reset the run or allow switching modes) ===== */
function freshState() { return { modeId: null, gems: CONFIG.startGems, opened: [], revealed: false, started: Date.now() }; }

function load() {
  try {
    const raw = localStorage.getItem(CONFIG.storageKey);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.opened)) return s;
    }
  } catch (e) { /* storage blocked: play without saving */ }
  return freshState();
}
function save() {
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch (e) { /* ignore */ }
}

// Add ?reset to the URL to start over (for rehearsals and testing).
if (new URLSearchParams(location.search).has("reset")) {
  try { localStorage.removeItem(CONFIG.storageKey); } catch (e) { /* ignore */ }
  history.replaceState(null, "", location.pathname);
}

let state = load();
let busy = false;      // true while a box is opening
let modal = null;      // null | {kind:"confirm", id} | {kind:"odds"}
let lastPull = null;   // most recent pull, shown in the box
let shaking = false;
let revealError = "";

/* ===== Helpers ===== */
const $app = document.getElementById("app");
const fmtUSD = n => "$" + n.toFixed(2);
const fmtWhole = n => "$" + Math.round(Math.round(n * 100) / 100).toLocaleString("en-US");
const fmtInt = n => n.toLocaleString("en-US");
const fmtPct = n => (Math.round(n * 10) / 10).toFixed(1) + "%";
const modeById = id => CONFIG.modes.find(m => m.id === id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reducedMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const usdPerGem = () => CONFIG.packUSD / CONFIG.startGems;

// Unbiased integer in 1..1000 using the browser's cryptographic RNG.
function roll1000() {
  if (window.crypto && crypto.getRandomValues) {
    const buf = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / 1000) * 1000;
    let x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return (x % 1000) + 1;
  }
  return Math.floor(Math.random() * 1000) + 1;
}
function pick(list) { return list[roll1000() % list.length]; }

function drawPull(mode) {
  const roll = roll1000();
  const tier = mode.tiers.find(t => roll <= t.max).name;
  const it = pick(CONFIG.items[tier]);
  return { tier, item: it.name, note: it.note, img: it.img, roll };
}

function counts() {
  const c = { Legendary: 0, Epic: 0, Rare: 0, Common: 0 };
  state.opened.forEach(p => { c[p.tier]++; });
  return c;
}

// Everything the receipt needs to compare the two modes over one full pack.
function modeStats(m) {
  const boxes = Math.floor(CONFIG.startGems / m.boxPrice);
  const left = CONFIG.startGems % m.boxPrice;
  const pct = name => m.tiers.find(t => t.name === name).pct / 100;
  const pL = pct("Legendary"), pE = pL + pct("Epic");
  return {
    boxes, left,
    gemPriceUSD: m.boxPrice * usdPerGem(),
    realPerBox: CONFIG.packUSD / boxes,
    chanceLeg: 1 - Math.pow(1 - pL, boxes),
    chanceEpicPlus: 1 - Math.pow(1 - pE, boxes),
    costPerLeg: (1 / pL) * (CONFIG.packUSD / boxes)
  };
}

function timerText() {
  const elapsed = Math.floor((Date.now() - state.started) / 1000);
  const left = CONFIG.timerSeconds - (elapsed % CONFIG.timerSeconds);
  return Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
}

/* ===== Screens ===== */
function headerHTML() {
  return `<div class="top"><div class="brand">GEM STORE</div><div class="wallet"><span>Gems</span>💎 ${fmtInt(state.gems)}</div></div>`;
}

function promoHTML() {
  return `<div class="promo">
    <span class="flash">⚡ High Roller: Legendary odds DOUBLED</span>
    <span class="timer">Offer ends in <b id="timer">${timerText()}</b></span>
  </div>`;
}

function fineprintHTML() {
  return `<div class="fineprint"><button data-action="odds">Probability disclosure</button></div>`;
}

function revealHTML() {
  return `<div class="reveal">
    <p>Done? Wait for your presenters to give you the code.</p>
    <form data-form="reveal" autocomplete="off">
      <input name="code" aria-label="Reveal code" placeholder="CODE" autocapitalize="characters" spellcheck="false">
      <button class="cta" type="submit">Reveal</button>
    </form>
    <div class="err" role="alert">${revealError}</div>
  </div>`;
}

function chooseHTML() {
  const cards = CONFIG.modes.map(m => `
    <button class="mode${m.featured ? " featured" : ""}" data-action="pick" data-id="${m.id}">
      <span class="badge">${m.badge}</span>
      <span class="name">${m.name}</span>
      <span class="pitch">${m.pitch}</span>
      <span class="price"><b>${fmtInt(m.boxPrice)} 💎</b> per box</span>
    </button>`).join("");
  return `
    ${headerHTML()}
    ${promoHTML()}
    <h1>Your Starter Pack is ready!</h1>
    <p class="sub">You have ${fmtInt(CONFIG.startGems)} 💎. Pick how you want to open.</p>
    <div class="modes">${cards}</div>
    ${revealHTML()}
    ${fineprintHTML()}`;
}

function boxHTML(mode) {
  const premium = mode.featured ? " premium" : "";
  if (shaking) return `<div class="box shake${premium}" aria-label="Opening box"><span class="q">?</span></div>`;
  if (lastPull) {
    return `<div class="box result t-${lastPull.tier}">
      <img class="portrait" src="${lastPull.img}" alt="${lastPull.item}" onerror="this.remove()">
      <span class="tier">${lastPull.tier}</span><span class="item">${lastPull.item}</span>
      <span class="note">${lastPull.note}</span></div>`;
  }
  return `<div class="box${premium}" aria-label="Unopened loot box"><span class="q">?</span></div>`;
}

function openHTML() {
  const m = modeById(state.modeId);
  const canOpen = Math.floor(state.gems / m.boxPrice);
  const c = counts();
  const chips = TIER_ORDER.filter(t => c[t] > 0).map(t => `<span class="chip ${t}">${t} × ${c[t]}</span>`).join("");
  const recent = state.opened.slice().reverse()
    .map(p => `<li><span class="who"><img src="${p.img}" alt="" onerror="this.remove()"><span class="${p.tier}">${p.item}</span></span><span class="${p.tier}">${p.tier}</span></li>`).join("");

  let action;
  if (canOpen > 0 || busy) {
    action = `<p class="count">${m.name} box · <b>${fmtInt(m.boxPrice)} 💎</b></p>
      <button class="cta" data-action="open" ${busy ? "disabled" : ""}>${busy ? "Opening…" : "Open box"}</button>`;
  } else {
    const need = m.boxPrice - state.gems;
    action = `<div class="hook">
      <p>So close! Only ${fmtInt(need)} more 💎 for another box.</p>
      <div class="topup"><span><b>${fmtInt(CONFIG.topUp.gems)} 💎</b> · ${fmtUSD(CONFIG.topUp.usd)}</span>
        <span class="lock">🔒 Demo limit: no top-ups</span></div>
    </div>`;
  }

  return `
    ${headerHTML()}
    ${promoHTML()}
    <div class="stage">${boxHTML(m)}</div>
    ${action}
    ${state.opened.length ? `<h2>Your pulls (${state.opened.length})</h2><div class="tally">${chips}</div><ul class="pulls">${recent}</ul>` : ""}
    ${revealHTML()}
    ${fineprintHTML()}`;
}

function receiptHTML() {
  const m = modeById(state.modeId);
  const n = state.opened.length;
  const c = counts();
  const [hr, std] = [modeById("high"), modeById("std")];
  const sH = modeStats(hr), sS = modeStats(std);
  const mine = id => (m && m.id === id ? " mine" : "");

  const leftUSD = state.gems * usdPerGem();
  const totalItems = TIER_ORDER.reduce((n, t) => n + CONFIG.items[t].length, 0);
  const pulled = TIER_ORDER.filter(t => c[t] > 0).map(t => `${c[t]} ${t}`).join(", ") || "nothing";
  const top = `<div class="receipt">
    <h1>Your receipt</h1>
    <div class="spent">${fmtUSD(CONFIG.packUSD)}</div>
    <p class="spentnote">That’s what your ${fmtInt(CONFIG.startGems)} 💎 Starter Pack costs.</p>
    <table>
      <tr><td>Mode</td><td>${m ? m.name : "None picked"}</td></tr>
      <tr><td>Boxes opened</td><td>${n}</td></tr>
      <tr><td>Real price of each box</td><td>${n ? fmtUSD(CONFIG.packUSD / n) : "—"}</td></tr>
      <tr class="warn"><td>Gems stuck in your account</td><td>${fmtInt(state.gems)} 💎 = ${fmtUSD(leftUSD)}</td></tr>
      <tr><td>What you got</td><td>${pulled}</td></tr>
      <tr><td>Collection</td><td>${new Set(state.opened.map(p => p.item)).size} of ${totalItems} portraits</td></tr>
    </table>
  </div>`;

  const headline = sH.chanceLeg < sS.chanceLeg
    ? `High Roller doubled the odds per box, and lowered your chance of a Legendary.`
    : `High Roller doubled the odds per box.`;

  const row = (label, a, b, why) =>
    `<tr><td>${label}${why ? `<span class="why">${why}</span>` : ""}</td><td class="${mine("high").trim()}">${a}</td><td class="${mine("std").trim()}">${b}</td></tr>`;

  const compare = `<div class="card">
    <h2>The two modes, honestly</h2>
    <p class="headline">${headline}</p>
    <table class="cmp">
      <tr><th></th><th class="${mine("high").trim()}">High Roller</th><th class="${mine("std").trim()}">Standard</th></tr>
      ${row("Price per box", `${fmtInt(hr.boxPrice)} 💎<span class="why">${fmtUSD(sH.gemPriceUSD)}</span>`, `${fmtInt(std.boxPrice)} 💎<span class="why">${fmtUSD(sS.gemPriceUSD)}</span>`)}
      ${row("Boxes from your pack", sH.boxes, sS.boxes)}
      ${row("Legendary odds per box", `${hr.tiers[0].pct}%`, `${std.tiers[0].pct}%`)}
      ${row("Chance of a Legendary", fmtPct(sH.chanceLeg * 100), fmtPct(sS.chanceLeg * 100), "across all your boxes")}
      ${row("Chance of Epic or better", fmtPct(sH.chanceEpicPlus * 100), fmtPct(sS.chanceEpicPlus * 100), "across all your boxes")}
      ${row("Average cost of one Legendary", fmtWhole(sH.costPerLeg), fmtWhole(sS.costPerLeg))}
      ${row("Gems left over", `${sH.left} 💎`, `${sS.left} 💎`)}
    </table>
  </div>`;

  const oddsRows = TIER_ORDER.map(t =>
    `<tr><td>${t}</td><td class="${mine("high").trim()}">${hr.tiers.find(x => x.name === t).pct}%</td><td class="${mine("std").trim()}">${std.tiers.find(x => x.name === t).pct}%</td></tr>`).join("");
  const odds = `<div class="card">
    <h2>The odds you weren’t shown</h2>
    <table class="cmp"><tr><th></th><th class="${mine("high").trim()}">High Roller</th><th class="${mine("std").trim()}">Standard</th></tr>${oddsRows}</table>
  </div>`;

  const tricks = `<div class="card">
    <h2>What the store did to you</h2>
    <ul class="tricks">
      <li><b>Changed the unit.</b> You thought in gems. Your pack cost ${fmtUSD(CONFIG.packUSD)}.</li>
      <li><b>Sold you a bigger number.</b> “2× odds” sounds better. Fewer boxes made it worse.</li>
      <li><b>Stranded your leftovers.</b> Neither box price divides ${fmtInt(CONFIG.startGems)} 💎, so everyone ends with gems they can’t spend.</li>
      <li><b>Hid the odds.</b> They sat behind a tiny link at the bottom.</li>
      <li><b>Faked urgency.</b> The “offer ends” timer restarted every ${CONFIG.timerSeconds / 60} minutes.</li>
    </ul>
  </div>`;

  return `${top}${compare}${odds}${tricks}
    <p class="footer">No real money was charged. Nothing you did left your phone.</p>`;
}

function modalHTML() {
  if (!modal) return "";
  if (modal.kind === "confirm") {
    const m = modeById(modal.id);
    return `<div class="modal" data-action="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="Confirm mode">
      <p>Lock in <b>${m.name}</b>? Each box costs <b>${fmtInt(m.boxPrice)} 💎</b>.</p>
      <p class="fine">You can’t switch modes after you choose.</p>
      <div class="actions"><button class="ghost" data-action="close">Back</button>
      <button class="cta" data-action="choose" data-id="${m.id}">Lock in</button></div>
    </div></div>`;
  }
  if (modal.kind === "odds") {
    const lines = CONFIG.modes.map(m => `${m.name}: ` + m.tiers.map(t => `${t.name} ${t.pct}%`).join(", ")).join(". ");
    return `<div class="modal" data-action="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="Probability disclosure">
      <p class="tiny">PROBABILITY DISCLOSURE. Item drop probabilities per loot box. ${lines}.
      Rarity follows how recently each figure served; the most recent are rarest. Gems are sold in Starter Packs of ${fmtInt(CONFIG.startGems)}. Items have no cash value. Rates may change at any time without notice.</p>
      <div class="actions"><button class="ghost" data-action="close">Close</button></div>
    </div></div>`;
  }
  return "";
}

function render() {
  let body;
  if (state.revealed) body = receiptHTML();
  else if (!state.modeId) body = chooseHTML();
  else body = openHTML();
  $app.innerHTML = body + modalHTML();
}

/* ===== Actions ===== */
async function openOne() {
  const m = modeById(state.modeId);
  if (busy || !m || state.gems < m.boxPrice) return;
  busy = true;
  state.gems -= m.boxPrice;
  const pull = drawPull(m);
  state.opened.push(pull);
  save();
  if (!reducedMotion()) {
    shaking = true; render();
    await sleep(pull.tier === "Common" ? 900 : 1400);   // rarer pulls shake longer
    shaking = false;
  }
  lastPull = pull;
  busy = false;
  render();
}

$app.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || busy) return;
  const action = el.dataset.action;
  if (action === "close") {
    // Clicking the dark backdrop closes; clicks inside the sheet don't.
    if (el.classList.contains("modal") && e.target !== el) return;
    modal = null; render();
  } else if (action === "pick") {
    modal = { kind: "confirm", id: el.dataset.id }; render();
  } else if (action === "choose") {
    if (state.modeId) return;              // one choice only
    state.modeId = el.dataset.id;
    save(); modal = null; render();
  } else if (action === "open") {
    openOne();
  } else if (action === "odds") {
    modal = { kind: "odds" }; render();
  }
});

$app.addEventListener("submit", e => {
  const form = e.target.closest("[data-form='reveal']");
  if (!form) return;
  e.preventDefault();
  if (busy) return;
  const code = (form.elements.code.value || "").trim().toUpperCase();
  if (code === CONFIG.revealCode.toUpperCase()) {
    revealError = "";
    state.revealed = true;
    modal = null;
    save();
    render();
    window.scrollTo(0, 0);
  } else {
    revealError = "Not yet. Wait for the presenters.";
    render();
    const f = $app.querySelector("[data-form='reveal']");
    if (f) f.classList.add("wrong");
  }
});

// Keep the fake countdown ticking without re-rendering the page.
setInterval(() => {
  const t = document.getElementById("timer");
  if (t) t.textContent = timerText();
}, 1000);

// Preload portraits so each reveal shows instantly.
TIER_ORDER.forEach(t => CONFIG.items[t].forEach(it => { const im = new Image(); im.src = it.img; }));

render();
</script>
</body>
</html>
